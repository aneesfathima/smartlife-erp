#sudo docker network create network-odoo
#sudo docker compose -f docker-compose.yaml up
services:


  postgres-db:
    image: postgres:16
    environment:
      POSTGRES_DB: erp.smartlifefoundation.org
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./config/pg_hba.conf.txt:/var/lib/postgresql/data/pgdata/pg_hba.conf
      - ./config/postgresql.conf.txt:/var/lib/postgresql/data/pgdata/postgresql.conf
      - postgres-data:/var/lib/postgresql/data
    networks:
      - default
    ports:
      - "5432:5432"

  odoo17:
    #image: odoo:14.0
    image: ghcr.io/arun-art06/odoo-17.1:1.5
    #image: ghcr.io/arun-art06/odoo-17-posxhero:1.1
    restart: always    
    #container_name: odoo14_odoo14_1
    depends_on:
      - postgres-db
    #command: sh /etc/odoo/deployment.sh
    ports:
      - "8091:8069" #for odoo server port mapping
      - "8092:8072" #for long polling port mapping
    extra_hosts:
      - "es01:host-gateway" 
      - "host.docker.internal:host-gateway"      
    deploy:
      resources:
        limits:
          memory: "4G"  # Increase to 4GB
    volumes:
      - ./cert:/var/cert
      - odoo17-data:/var/lib/odoo 
      - ./config:/etc/odoo
      - ./addons:/mnt/extra-addons 
      - ./media:/etc/media 
      - ./data:/var/lib/odoo
      - ./uploads:/var/lib/uploads

    environment:
        - HOST=postgres-db
        - USER=odoo
        - PASSWORD=odoo
        - ENVIRONMENT=development
        #- HOST=pgbouncer
        #- USER=postgresadmin
        #- PASSWORD=Ftjskiasals3w909sjaosds

volumes:
  odoo17-data: 
  postgres-data: 
  
networks:
  default:
    external: true
    name: network-odoo
